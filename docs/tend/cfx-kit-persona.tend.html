# cfx-kit-persona — who cfx-kit is for
**Who.** A developer, or an agent working for one, who builds or keeps one of the c-f-x tools and has to meet the family's rules without writing the guards again in every repository.

## Jobs
- When I start a new tool repository, I want one command that names every family rule it breaks, so I can fix them before its first pull request · from the cfx-status spec, the kit's first consumer
- When I deploy a tool, I want to see the plan and the undo of each step before anything changes, so I can stop a bad deploy before it starts · from cfanalytics' ops runner, which the kit's runner came from
