# cfx-kit-opportunity — the pain cfx-kit answers
**Pain.** Each tool copies the same guards and scripts by hand, and the copies drift: cfanalytics and cfmail each keep their own docs, Wrangler-config and migration checks.

## Signals
- metric: the number of guard scripts a tool keeps that the kit also has, which falls to none as tools move onto the kit
- risk: a rule fixed in one tool's copy stays broken in the others, and nobody notices until it bites
