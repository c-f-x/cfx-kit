name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps that show it
      description: The smallest set of steps, from a fresh install where you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you run.
    validations:
      required: false
